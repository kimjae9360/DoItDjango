<!doctype html>
<!--
  이 파일은 간단한 예제 HTML입니다.
  아래에 각 코드 블록마다 한국어 주석을 추가하여 의미를 설명합니다.
-->
<html lang="ko">
  <head>
    <!-- 문서 문자 인코딩을 UTF-8로 지정합니다. 한글을 안전하게 표시하기 위해 필요합니다. -->
    <meta charset="UTF-8" />
    <!-- 반응형 화면을 위해 뷰포트 설정을 합니다. 모바일에서 정상적으로 보이게 합니다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 문서 제목: 브라우저 탭에 표시됩니다. -->
    <title>KJW BLOG</title>

    <!-- 부트스트랩의 css를 사용할 수 있도록 다운 받고 상대 경로를 설정했다. -->
    <link
      href="./bootstrap4/css/bootstrap.min.css"
      rel="stylesheet"
      type="text/css"
    />

    <!-- 외부 CSS 파일을 불러옵니다. 상대 경로로 practice.css를 사용합니다. -->
    <link href="./practice.css" rel="stylesheet" type="text/css" />

    <!-- 외부 Javascript 파일을 불러옵니다. 상대 경로로 add_two_number.js와 what_time_is_it.js를 사용합니다.-->
    <script type="text/javascript" src="add_two_numbers.js"></script>
    <script type="text/javascript" src="what_time_is_it.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="./index.html">Do It Django</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavDropdown"
          aria-controls="navbarNavDropdown"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="./index.html"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./blog_list.html">Blog</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about_me.html">About me</a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Dropdown link
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Home</a></li>
                <li><a class="dropdown-item" href="#">Features</a></li>
                <li>
                  <a class="dropdown-item" href="#">Pricing</a>
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- 제목 태그들: h1~h5는 서로 다른 중요도(크기)를 나타냅니다.  -->
    <h1>첫번째 크기 헤드라인</h1>
    <h2>두번째 크기 헤드라인</h2>
    <h3>세번째 크기 헤드라인</h3>
    <h4>네번째 크기 헤드라인</h4>
    <h5>다섯번째 크기 헤드라인</h5>

    <!-- 버튼: 클릭하면 현재 시간을 알려주는 whatTimeIsIt 함수를 호출합니다. -->
    <button onclick="whatTimeIsIt()">현재시간</button><br />

    <!--
      두 개의 입력 필드와 라벨입니다.
      onkeyup 이벤트로 키 입력이 일어날 때마다 doSomething()을 호출하여 즉시 계산 결과를 갱신합니다.
    -->
    <label for="inputA">a</label>
    <input id="inputA" value="1" onkeyup="doSomething()" />
    <label for="inputB">b</label>
    <input id="inputB" value="2" onkeyup="doSomething()" />

    <!--
      계산 결과를 보여주는 영역입니다.
      valueA, valueB, valueC 각 스팬에 doSomething에서 값을 채워 넣습니다.
      초기값은 1+2=3으로 설정되어 있습니다.
    -->
    <p>
      <span id="valueA">1</span>+<span id="valueB">2</span>=<span id="valueC"
        >3</span
      >
    </p>

    <!-- 일반 문단 예시 -->
    <p>문단은 p로 쓰세요. p는 아마도 Paragraph의 앞글자를 따온 것이겠죠?</p>

    <!-- 외부 사이트로 이동하는 링크 예시 -->
    <a href="https://www.google.com">Go to google</a>

    <!-- 수평선 (구분자) -->
    <hr />

    <!-- 이미지 삽입: 상대 경로로 images 폴더의 beauty.jpeg 파일을 불러옵니다. width로 크기 지정 -->
    <img src="./images/beauty.jpeg" width="600px" />

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
